services:
  smart3w-mcp:
    # 默认 latest；生产建议固定版本，例如 SMART3W_IMAGE_TAG=v2.9.2 docker compose up -d
    image: kid941005/smart3w-mcp:${SMART3W_IMAGE_TAG:-latest}
    container_name: smart3w-mcp
    restart: unless-stopped
    init: true
    # 使用宿主机网络：服务直接监听宿主机端口，不需要 ports 映射。
    # SMART3W_HOST 控制绑定地址（0.0.0.0 对外，127.0.0.1 仅本机）；
    # SMART3W_PORT 控制监听端口（默认 50826，健康检查同步使用）。
    network_mode: host
    # Chrome 需要较大的共享内存，默认 64MB 容易崩，这里给 1GB
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SEARXNG_INSTANCE: ${SEARXNG_INSTANCE:-https://searxng.example.com:59826}
      SMART3W_ALLOWED_HOSTS: ${SMART3W_ALLOWED_HOSTS:-}
      SMART3W_RESPECT_ROBOTS: ${SMART3W_RESPECT_ROBOTS:-0}
      SMART3W_PROXY_URL: ${SMART3W_PROXY_URL:-}
      SMART3W_TRUST_PROXY_DNS: ${SMART3W_TRUST_PROXY_DNS:-0}
      HTTP_PROXY: ${SMART3W_PROXY_URL:-}
      HTTPS_PROXY: ${SMART3W_PROXY_URL:-}
      ALL_PROXY: ${SMART3W_PROXY_URL:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,searxng}
      MCP_TRANSPORT: streamable-http
      MCP_PATH: /mcp
      # host 网络下直接监听的地址；127.0.0.1 仅允许本机/反向代理访问，0.0.0.0 监听所有网卡
      SMART3W_HOST: ${SMART3W_HOST:-0.0.0.0}
      # host 网络下实际监听端口，同时用于健康检查
      SMART3W_PORT: ${SMART3W_PORT:-50826}
      SMART3W_TIMEOUT: ${SMART3W_TIMEOUT:-30}
      # smart3w_interact 保存登录 Cookie / localStorage 的目录（容器内路径）
      SMART3W_PROFILE_DIR: ${SMART3W_PROFILE_DIR:-/data/profiles}
      # fetch / stealthy 使用的 Chrome 路径
      SMART3W_CHROME: ${SMART3W_CHROME:-/opt/google/chrome/chrome}
      # smart3w_interact 使用的 Chrome 路径（和上面是两个不同的环境变量名）
      SMART3W_CHROME_PATH: ${SMART3W_CHROME_PATH:-/opt/google/chrome/chrome}
      # 1=后台无界面运行；0=显示浏览器窗口。容器部署一般用 1
      SMART3W_BROWSER_HEADLESS: ${SMART3W_BROWSER_HEADLESS:-1}
      # 1=关闭 Chrome 沙箱；普通部署保持 0（root 容器会自动启用）
      SMART3W_BROWSER_NO_SANDBOX: ${SMART3W_BROWSER_NO_SANDBOX:-0}
    volumes:
      # 登录状态保存到当前目录下的 smart3w_profiles/，删容器/重建后仍在
      - ./smart3w_profiles:/data/profiles
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,os; socket.create_connection(('127.0.0.1', int(os.environ.get('SMART3W_PORT','50826'))), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
