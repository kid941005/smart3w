[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart3w"
version = "2.3.0"
description = "智能网页搜索与抓取 MCP 服务器（SearXNG + Python HTTP + curl + scrapling）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kid941005" }]
keywords = ["mcp", "search", "scraper", "searxng", "llm", "web"]
dependencies = [
    "mcp>=1.6.0,<2",
    "httpx>=0.27",
    "scrapling[all]>=0.4.2",
    "readability-lxml>=0.8.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
smart3w-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/kid941005/smart3w"
Issues = "https://github.com/kid941005/smart3w/issues"

[tool.setuptools]
py-modules = ["mcp_server", "smart3w_core", "smart3w_fetch_utils", "smart3w_url_utils"]
packages = ["scripts"]
include-package-data = true

[tool.setuptools.package-data]
scripts = ["*.py", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
