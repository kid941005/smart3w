[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart3w"
version = "2.2.6"
description = "智能网页搜索与抓取 MCP 服务器（SearXNG + curl + scrapling）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kid941005" }]
keywords = ["mcp", "search", "scraper", "searxng", "llm", "web"]
dependencies = [
    "mcp>=1.6.0,<2",
    "scrapling[all]>=0.4.2",
    "readability-lxml>=0.8.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["mcp_server", "smart3w_fetch_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
