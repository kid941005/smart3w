[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart3w"
dynamic = ["version"]
description = "智能网页搜索与抓取 MCP 服务器（SearXNG + Python HTTP + curl + scrapling）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kid941005" }]
keywords = ["mcp", "search", "scraper", "searxng", "llm", "web"]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx[socks]>=0.27",
    "scrapling[all]>=0.4.2",
    "playwright>=1.40",
    "readability-lxml>=0.8.0",
    "lxml>=5.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "charset-normalizer>=3.3.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.scripts]
smart3w-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/kid941005/smart3w"
Issues = "https://github.com/kid941005/smart3w/issues"

[tool.setuptools]
py-modules = ["mcp_server", "smart3w_content", "smart3w_core", "smart3w_discovery", "smart3w_document", "smart3w_fetch_utils", "smart3w_interact", "smart3w_url_utils", "smart3w_rust", "smart3w_version"]
packages = ["scripts", "smart3w_mcp_tools"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "smart3w_version.__version__"}

[tool.setuptools.package-data]
scripts = ["*.py", "*.sh"]
smart3w_mcp_tools = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "mcp_server.py",
    "smart3w_content.py",
    "smart3w_core.py",
    "smart3w_discovery.py",
    "smart3w_document.py",
    "smart3w_fetch_utils.py",
    "smart3w_interact.py",
    "smart3w_rust.py",
    "smart3w_url_utils.py",
    "smart3w_version.py",
    "smart3w_mcp_tools",
]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^scripts/"]
