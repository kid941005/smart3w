[package]
name = "smart3w-rs"
version = "0.1.0"
edition = "2021"
description = "Rust acceleration backend for Smart3W: HTML->Markdown, PDF, XLSX/CSV parsing"
license = "MIT"
publish = false

[[bin]]
name = "smart3w-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2md = "0.2"
scraper = "0.20"
pdf-extract = "0.12"
calamine = { version = "0.38", features = ["dates"] }
csv = "1"
chrono = "0.4"
zip = { version = "2.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
